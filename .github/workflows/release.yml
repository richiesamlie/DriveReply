name: Autonomous CI Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Create CI Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Prepare Build Artifacts
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/DriveReply-v1.0.${{ github.run_number }}-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/DriveReply-v1.0.${{ github.run_number }}-release-unsigned.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DriveReply Build #${{ github.run_number }}
          body: |
            ## Autonomous CI Build Release
            
            This release was automatically generated by the Autonomous CI pipeline on commit `${{ github.sha }}`.
            
            ### Commit Message
            > ${{ github.event.head_commit.message }}
            
            ### Available Builds
            1. **Release Build (Unsigned)** (`DriveReply-v1.0.${{ github.run_number }}-release-unsigned.apk`): Full R8 minification and resource shrinking applied. Maximum performance and minimal size (~3MB). *Requires signing before installation on some devices.*
            2. **Debug Build** (`DriveReply-v1.0.${{ github.run_number }}-debug.apk`): Signed with standard debug keystore. Instantly installable for test and verification. Contains debug headers (~15MB).
          files: |
            build-artifacts/DriveReply-v1.0.${{ github.run_number }}-debug.apk
            build-artifacts/DriveReply-v1.0.${{ github.run_number }}-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

