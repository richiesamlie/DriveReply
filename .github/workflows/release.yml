name: Autonomous CI Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Optional suffix to append to v2.0.<run_number>-<suffix>'
        required: false
        default: ''

permissions:
  contents: read

# (SIGNING_KEYSTORE_REQUIRED is computed inside the build job, because the
# env context in `if:` does not see step-level secrets and we need the
# value alongside the secret itself. The two relevant inputs are
# github.event_name and github.ref.)
jobs:
  quality-gate:
    name: Lint + Test + Assemble
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest --console=plain

  build-and-release:
    name: Build APK and Create CI Release
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Submit dependency graph (SBOM)
        uses: gradle/actions/dependency-submission@v3
        with:
          build-scan-publish-action-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Validate and Normalize Tag Suffix
        id: meta
        env:
          RAW_TAG_SUFFIX: ${{ inputs.tag_suffix }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -n "$RAW_TAG_SUFFIX" ]; then
            if [[ ! "$RAW_TAG_SUFFIX" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "::error::Invalid tag_suffix. Only alphanumeric characters, '.', '_', and '-' are allowed." >&2
              exit 1
            fi
            NORMALIZED_SUFFIX="-${RAW_TAG_SUFFIX#-}"
          else
            NORMALIZED_SUFFIX=""
          fi
          VERSION_NAME="2.0.${RUN_NUMBER}${NORMALIZED_SUFFIX}"
          TAG_NAME="v${VERSION_NAME}"
          echo "normalized_suffix=${NORMALIZED_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Decode Keystore or Fail on Main
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_KEYSTORE_REQUIRED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          if [ -n "$SIGNING_KEYSTORE" ] && [ -n "$KEY_STORE_PASSWORD" ] && [ -n "$ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
            chmod 600 "$RUNNER_TEMP/release-key.jks"
            echo "::notice::Decoded signing keystore to RUNNER_TEMP ($(wc -c < "$RUNNER_TEMP/release-key.jks") bytes)"
          elif [ "$SIGNING_KEYSTORE_REQUIRED" = "true" ]; then
            echo "::error::RELEASE builds on main require all 4 signing secrets (SIGNING_KEYSTORE, KEY_STORE_PASSWORD, ALIAS, KEY_PASSWORD). Refusing to ship an unsigned APK." >&2
            exit 1
          elif [ -n "$SIGNING_KEYSTORE" ] || [ -n "$KEY_STORE_PASSWORD" ] || [ -n "$ALIAS" ] || [ -n "$KEY_PASSWORD" ]; then
            echo "::error::Partial signing secrets configured. All 4 secrets (SIGNING_KEYSTORE, KEY_STORE_PASSWORD, ALIAS, KEY_PASSWORD) must be set together." >&2
            exit 1
          else
            echo "::warning::Signing secrets are not set. Building unsigned release APK for workflow_dispatch verification; public GitHub Release creation will be skipped."
          fi

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease
        env:
          RELEASE_VERSION_CODE: ${{ github.run_number }}
          RELEASE_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Clean Up Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.jks"

      - name: Prepare Signed Release Artifacts
        id: prepare
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "build-artifacts/DriveReply-${TAG_NAME}-release.apk"
            echo "release_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release APK is unsigned; skipping public GitHub Release publication."
            echo "release_signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SHA256SUMS
        if: steps.prepare.outputs.release_signed == 'true'
        run: |
          set -euo pipefail
          cd build-artifacts
          sha256sum DriveReply-*-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: steps.prepare.outputs.release_signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: DriveReply Build #${{ github.run_number }}${{ steps.meta.outputs.normalized_suffix }}
          body: |
            ## Autonomous CI Build Release

            This release was automatically generated by the Autonomous CI pipeline on commit `${{ github.sha }}`.

            ### Quality Gates
            * `lintDebug` — pass
            * `testDebugUnitTest` — pass
            * `assembleDebug` + `assembleRelease` — pass

            ### Available Builds
            * **Release Build**: Full R8 minification, resource shrinking, and production signing applied.

            ### Integrity
            * `SHA256SUMS.txt` is attached alongside the signed release APK.
          files: |
            build-artifacts/DriveReply-*-release.apk
            build-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
