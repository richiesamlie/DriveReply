name: Autonomous CI Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Optional suffix to append to v1.0.<run_number>-<suffix>'
        required: false
        default: ''

permissions:
  contents: write

# Refuse to run if a keystore isn't configured for a main-branch push.
# This prevents unsigned APKs from being shipped under the "release" tag.
env:
  SIGNING_KEYSTORE_REQUIRED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  quality-gate:
    name: Lint + Test + Assemble
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      - name: Unit Tests
        run: ./gradlew testDebugUnitTest --console=plain

  build-and-release:
    name: Build APK and Create CI Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Submit dependency graph (SBOM)
        uses: gradle/actions/dependency-submission@v3
        with:
          build-scan-publish-action-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        if: ${{ env.SIGNING_KEYSTORE != '' }}
        run: |
          echo "$SIGNING_KEYSTORE" | base64 --decode > release-key.jks

      - name: Verify Keystore Present (Main Branch)
        if: env.SIGNING_KEYSTORE_REQUIRED == 'true' && env.SIGNING_KEYSTORE == ''
        run: |
          echo "::error::RELEASE builds on main require a SIGNING_KEYSTORE secret. Refusing to ship an unsigned APK." >&2
          exit 1

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease
        env:
          RELEASE_VERSION_CODE: ${{ github.run_number }}
          RELEASE_VERSION_NAME: 1.0.${{ github.run_number }}${{ inputs.tag_suffix }}
          RELEASE_KEYSTORE_PATH: ../release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Build Artifacts
        id: prepare
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/DriveReply-v1.0.${{ github.run_number }}${{ inputs.tag_suffix }}-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-artifacts/DriveReply-v1.0.${{ github.run_number }}${{ inputs.tag_suffix }}-release.apk
            echo "release_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release APK is unsigned. This is acceptable for workflow_dispatch and PR builds, but not for main-branch pushes (the 'Verify Keystore Present' step blocks those)."
            cp app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/DriveReply-v1.0.${{ github.run_number }}${{ inputs.tag_suffix }}-release-unsigned.apk
            echo "release_signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SHA256SUMS
        run: |
          cd build-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}${{ inputs.tag_suffix }}
          name: DriveReply Build #${{ github.run_number }}${{ inputs.tag_suffix }}
          body: |
            ## Autonomous CI Build Release

            This release was automatically generated by the Autonomous CI pipeline on commit `${{ github.sha }}`.

            ### Commit Message
            > ${{ github.event.head_commit.message }}

            ### Quality Gates
            * `lintDebug` — pass
            * `testDebugUnitTest` — pass
            * `assembleDebug` + `assembleRelease` — pass

            ### Available Builds
            * **Release Build**: Full R8 minification and resource shrinking applied. Maximum performance and minimal size.
              * *Signed:* **${{ steps.prepare.outputs.release_signed }}** — set `SIGNING_KEYSTORE` in repository secrets to ship a signed release.
            * **Debug Build**: Signed with the standard debug keystore. Instantly installable for local testing and verification.

            ### Integrity
            * `SHA256SUMS.txt` is attached alongside the APKs.
          files: |
            build-artifacts/*.apk
            build-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
