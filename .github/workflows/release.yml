name: Autonomous CI Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Create CI Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Decode Keystore (Optional)
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        if: ${{ env.SIGNING_KEYSTORE != '' }}
        run: |
          echo "$SIGNING_KEYSTORE" | base64 --decode > release-key.jks

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease
        env:
          RELEASE_VERSION_CODE: ${{ github.run_number }}
          RELEASE_VERSION_NAME: 1.0.${{ github.run_number }}
          RELEASE_KEYSTORE_PATH: ../release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Build Artifacts
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/DriveReply-v1.0.${{ github.run_number }}-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-artifacts/DriveReply-v1.0.${{ github.run_number }}-release.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/DriveReply-v1.0.${{ github.run_number }}-release-unsigned.apk
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DriveReply Build #${{ github.run_number }}
          body: |
            ## Autonomous CI Build Release
            
            This release was automatically generated by the Autonomous CI pipeline on commit `${{ github.sha }}`.
            
            ### Commit Message
            > ${{ github.event.head_commit.message }}
            
            ### Available Builds
            * **Release Build**: Full R8 minification and resource shrinking applied. Maximum performance and minimal size (~3MB).
              * *Note: If a signed keystore was provided in GitHub Secrets, the release APK (`DriveReply-v1.0.${{ github.run_number }}-release.apk`) is fully signed and ready for production install. Otherwise, the unsigned APK (`DriveReply-v1.0.${{ github.run_number }}-release-unsigned.apk`) is attached.*
            * **Debug Build** (`DriveReply-v1.0.${{ github.run_number }}-debug.apk`): Signed with standard debug keystore. Instantly installable for local testing and verification (~15MB).
          files: |
            build-artifacts/DriveReply-v1.0.${{ github.run_number }}-debug.apk
            build-artifacts/DriveReply-v1.0.${{ github.run_number }}-release*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

